<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 - 日系櫻花風</title>

  <!-- CSS 樣式區域 -->
  <style>
    /* =========================================================
       1. 全局與主題顏色設定 (方便後續修改顏色)
       ========================================================= */
    :root {
      /* 櫻花粉色調 */
      --primary-pink: #ffb7c5;      /* 主櫻花粉 */
      --soft-pink: #fff0f5;         /* 柔和櫻花底色 (LavenderBlush) */
      --accent-pink: #ff6b8b;       /* 高亮/強調櫻花紅 */
      --gold-accent: #ffd700;       /* 亮起發光時的金粉色邊框 */

      /* 文字與背景 */
      --text-color: #5a4b4c;        /* 沉穩深木色文字 (比純黑更具日系質感) */
      --card-bg: rgba(255, 255, 255, 0.85); /* 半透明雪白卡片 */
      --bg-gradient: linear-gradient(135deg, #ffe6eb 0%, #def3f8 100%); /* 櫻花粉藍漸層背景 */

      /* 輪播動畫速度控制 */
      --transition-speed: 0.6s;     /* 卡片縮放與發光過渡時間 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 頁面標題區 */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #d85c76;
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    header p {
      font-size: 1rem;
      color: #8c6b73;
    }

    /* =========================================================
       2. 酷炫載入中動畫 (Loading Animation)
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .sakura-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--primary-pink);
      border-top: 4px solid var(--accent-pink);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      color: var(--accent-pink);
      font-weight: bold;
      letter-spacing: 1px;
      animation: blink 1.5s ease-in-out infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      /* 使用 CSS column 實現瀑布流 */
      column-count: 4;          /* 預設 4 欄 */
      column-gap: 20px;         /* 欄位間距 */
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
    }

    /* 響應式調整欄位數量 */
    @media (max-width: 1024px) {
      .masonry-wall { column-count: 3; }
    }
    @media (max-width: 768px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 480px) {
      .masonry-wall { column-count: 1; }
    }

    /* 留言卡片基礎樣式 */
    .card {
      break-inside: avoid;      /* 防止卡片被斷開到下一欄 */
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 183, 197, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(5px);
      position: relative;
      transition: all var(--transition-speed) ease;
      cursor: pointer;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--primary-pink);
      padding-bottom: 8px;
    }

    .card-avatar {
      width: 32px;
      height: 32px;
      background-color: var(--primary-pink);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
      font-size: 0.9rem;
    }

    .card-author {
      font-weight: bold;
      font-size: 1.05rem;
      color: #333;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      color: var(--text-color);
    }

    /* =========================================================
       4. 輪播 Highlight 特效與非焦點變暗效果
       ========================================================= */

    /* 當有卡片被高亮時，給整個容器加上 class，讓其他卡片變暗變模糊 */
    .masonry-wall.has-highlight .card:not(.highlight) {
      opacity: 0.4;             /* 未選中卡片透明度降低 */
      filter: blur(1.5px);      /* 未選中卡片稍微模糊 */
      transform: scale(0.96);   /* 未選中卡片微幅縮小 */
    }

    /* 被選中的卡片高亮 (Highlight) 特效 */
    .card.highlight {
      opacity: 1 !important;
      filter: blur(0) !important;
      transform: scale(1.08) !important; /* 卡片放大 */
      z-index: 10;                        /* 提升層級避免被遮擋 */
      border: 2px solid var(--accent-pink); /* 鮮豔櫻花紅邊框 */
      box-shadow: 0 0 25px rgba(255, 107, 139, 0.6), 
                  0 0 10px var(--gold-accent); /* 日系金粉色發光特效 */
    }

    /* 櫻花瓣裝飾 (卡片右上角) */
    .card::after {
      content: '🌸';
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- 頁面頂部 -->
  <header>
    <h1>🌸 櫻花留言板 🌸</h1>
    <p>來自朋友們的溫暖祝福與悄悄話</p>
  </header>

  <!-- 載入中動畫容器 -->
  <div id="loading-container">
    <div class="sakura-spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流留言卡片容器 -->
  <div id="masonry-wall" class="masonry-wall"></div>

  <!-- JavaScript 腳本區域 -->
  <script>
    /* =========================================================
       控制參數設定 (方便修改)
       ========================================================= */
    // Google 試算表發佈的 CSV 網址
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRv9BWB4TMBnr16W_nvb1jU9ZApDVtwdPbocLS8ry6806neCp3N4k6RLsidc6IB_zMrWvWpc6TChBoR/pub?output=csv';

    // ⚡ 輪播間隔時間：預設 3000毫秒 (即 3 秒)。欲修改輪播速度請改此數值。
    const ROTATION_INTERVAL_MS = 3000;

    // 全局變數
    let messages = [];      // 儲存解析後的留言資料
    let currentIndex = -1;  // 目前高亮的卡片索引
    let carouselTimer = null; // 計時器物件

    /* =========================================================
       1. 健壯的 CSV 解析器 (Robust CSV Parser)
       處理留言內容中可能包含的逗號 (,) 與換行符號
       ========================================================= */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') { // 雙引號轉義 ""
            currentField += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !insideQuotes) { // 遇到欄位分隔符號
          row.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) { // 遇到換行
          if (char === '\r' && nextChar === '\n') i++; // 處理 \r\n
          row.push(currentField.trim());
          if (row.some(field => field.length > 0)) {
            lines.push(row);
          }
          row = [];
          currentField = '';
        } else {
          currentField += char;
        }
      }

      // 處理最後一行資料
      if (currentField || row.length > 0) {
        row.push(currentField.trim());
        lines.push(row);
      }

      return lines;
    }

    /* =========================================================
       2. 讀取並處理 Google 試算表資料
       ========================================================= */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading-container');
      const wallEl = document.getElementById('masonry-wall');

      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error('網路回應錯誤');

        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // 移除表頭 (第一行：時間戳記、名字、悄悄話)
        const dataRows = parsedRows.slice(1);

        // 轉換為物件陣列 [ { time, name, content }, ... ]
        messages = dataRows.map(row => ({
          timestamp: row[0] || '',
          name: row[1] || '匿名朋友',
          content: row[2] || '（無留言內容）'
        })).filter(msg => msg.name !== '' || msg.content !== '');

        // 隱藏 Loading 動畫
        loadingEl.style.display = 'none';

        if (messages.length === 0) {
          wallEl.innerHTML = '<div style="text-align:center; width:100%;">目前還沒有任何留言喔！</div>';
          return;
        }

        // 動態生成卡片
        renderCards(messages);

        // 開啟隨時間輪播高亮特效
        startCarousel();

      } catch (error) {
        console.error('讀取試算表失敗:', error);
        loadingEl.innerHTML = `<div class="loading-text" style="color:#d85c76;">無法載入留言，請稍後再試。</div>`;
      }
    }

    /* =========================================================
       3. 動態渲染卡片至 DOM
       ========================================================= */
    function renderCards(dataList) {
      const wallEl = document.getElementById('masonry-wall');
      wallEl.innerHTML = '';

      dataList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index; // 綁定索引供輪播定位

        // 取名字第一個字作為頭像顯示
        const firstLetter = item.name.trim().charAt(0) || '🌸';

        card.innerHTML = `
          <div class="card-header">
            <div class="card-avatar">${firstLetter}</div>
            <div class="card-author">${escapeHTML(item.name)}</div>
          </div>
          <div class="card-content">${escapeHTML(item.content).replace(/\n/g, '<br>')}</div>
        `;

        wallEl.appendChild(card);
      });
    }

    /* 防止 XSS 攻擊的簡單轉義函數 */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =========================================================
       4. 輪播 Highlight 特效邏輯 (重點)
       ========================================================= */
    function startCarousel() {
      const cards = document.querySelectorAll('.card');
      const wallEl = document.getElementById('masonry-wall');

      if (cards.length === 0) return;

      // 容器加上 has-highlight，啟動未選中卡片的模糊/變暗效果
      wallEl.classList.add('has-highlight');

      // 執行高亮切換的函式
      function highlightNextCard() {
        // 移除前一張卡片的高亮狀態
        if (currentIndex >= 0 && cards[currentIndex]) {
          cards[currentIndex].classList.remove('highlight');
        }

        // 計算下一個高亮索引 (循環輪播)
        currentIndex = (currentIndex + 1) % cards.length;

        // 為當前卡片加上高亮樣式
        const targetCard = cards[currentIndex];
        targetCard.classList.add('highlight');

        // 平滑滾動確保高亮的卡片在可視範圍內 (對手機端特別友好)
        targetCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }

      // 立即執行第一次高亮
      highlightNextCard();

      // ⏰ 設定每隔 3 秒 (ROTATION_INTERVAL_MS) 輪播一次
      carouselTimer = setInterval(highlightNextCard, ROTATION_INTERVAL_MS);
    }

    // 頁面載入完成後自動執行讀取
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
