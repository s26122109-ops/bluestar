<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 朋友對我的悄悄話留言板 🌸</title>
  
  <!-- 引入日系風格 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全域變數設定 (方便自訂顏色與主題)
       ========================================== */
    :root {
      /* 主題色彩設定 */
      --bg-color: #fff8f9;              /* 頁面背景色 (淡粉白) */
      --primary-color: #e87a90;         /* 主色調 (櫻花粉) */
      --secondary-color: #fca0b0;       /* 輔助色 (淺櫻粉) */
      --text-main: #59423e;             /* 主要文字顏色 (深木褐) */
      --text-muted: #8c7671;            /* 次要文字顏色 (淺灰褐) */
      --card-bg: rgba(255, 255, 255, 0.85); /* 卡片背景色 (半透明白，打造玻璃質感) */
      
      /* 高亮輪播卡片的特效色彩 (發光與邊框) */
      --highlight-border: #ff4d73;     /* 輪播高亮卡片邊框色 */
      --highlight-shadow: rgba(255, 117, 143, 0.5); /* 輪播高亮卡片發光陰影 */
      
      /* 牆面字型 */
      --font-family: 'Kiwi Maru', 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 50px;
    }

    /* 背景飄落櫻花 Canvas */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 讓滑鼠穿透，不影響點擊 */
      z-index: 0;
    }

    /* 頁面標題區 */
    header {
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-color);
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(232, 122, 144, 0.15);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* 容器設定 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* ==========================================
       2. 酷炫載入中動畫 (Loading Effect)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    /* 花瓣旋轉動畫 */
    .sakura-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--secondary-color);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
      box-shadow: 0 0 15px var(--secondary-color);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      color: var(--primary-color);
      font-weight: 500;
      letter-spacing: 1.5px;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-wall {
      column-count: 4; /* 預設 4 欄 */
      column-gap: 20px;
      width: 100%;
    }

    /* 響應式欄位調整 */
    @media (max-width: 1100px) { .masonry-wall { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-wall { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-wall { column-count: 1; } }

    /* ==========================================
       4. 留言卡片基礎樣式與高亮輪播特效
       ========================================== */
    .card {
      break-inside: avoid; /* 防止卡片被斷開切半 */
      margin-bottom: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 183, 197, 0.4);
      box-shadow: 0 4px 15px rgba(232, 122, 144, 0.08);
      position: relative;
      overflow: hidden;
      
      /* 設定平滑過渡效果，輪播時才不會卡頓 */
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    /* 卡片頂部角落的日系櫻花小圖標Decoration */
    .card::before {
      content: '🌸';
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.9rem;
      opacity: 0.4;
    }

    /* 卡片內部內容樣式 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(232, 122, 144, 0.3);
    }

    .card-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-message {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap; /* 保持原文字的換行格式 */
      word-break: break-word;
    }

    /* --- 滑鼠懸停效果 --- */
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(232, 122, 144, 0.18);
    }

    /* --- ✨【輪播重點特效】未選中的卡片：變暗且微模糊 --- */
    .masonry-wall.has-highlight .card:not(.highlight) {
      opacity: 0.45;
      filter: blur(1.5px) grayscale(20%);
      transform: scale(0.96);
    }

    /* --- ✨【輪播重點特效】被選中的高亮卡片：放大亮起 --- */
    .card.highlight {
      opacity: 1 !important;
      filter: none !important;
      transform: scale(1.08) z-index(10) !important;
      z-index: 10;
      border: 2px solid var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-shadow), 0 10px 30px rgba(0, 0, 0, 0.12);
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 背景櫻花畫布 -->
  <canvas id="sakura-canvas"></canvas>

  <header>
    <h1>🌸 櫻花悄悄話留言板 🌸</h1>
    <p>點點滴滴，記錄朋友對我的暖心動態祝福</p>
  </header>

  <div class="container">
    <!-- 讀取中動畫區塊 -->
    <div id="loading">
      <div class="sakura-spinner"></div>
      <p>讀取留言中...</p>
    </div>

    <!-- 瀑布流留言卡片牆 -->
    <div id="wall" class="masonry-wall"></div>
  </div>

  <script>
    /* ==========================================================================
       設定參數區 (方便修改顏色與輪播秒數)
       ========================================================================== */
    const CONFIG = {
      // CSV 試算表發佈網址
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRv9BWB4TMBnr16W_nvb1jU9ZApDVtwdPbocLS8ry6806neCp3N4k6RLsidc6IB_zMrWvWpc6TChBoR/pub?output=csv',
      
      // ✨【輪播秒數設定】控制輪播時間間隔 (單位：毫秒，3000ms = 3秒)
      carouselInterval: 3000,
      
      // 櫻花飄落數量
      sakuraCount: 30
    };

    /* ==========================================================================
       1. CSV 解析函數 (正確處理引號、換行與逗號)
       ========================================================================== */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            entry += '"';
            i++; // 跳過雙引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') {
            result.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }
      if (entry || row.length > 0) {
        row.push(entry.trim());
        result.push(row);
      }
      return result;
    }

    /* ==========================================================================
       2. 資料讀取與動態渲染卡片
       ========================================================================== */
    async function fetchAndRenderMessages() {
      const loadingEl = document.getElementById('loading');
      const wallEl = document.getElementById('wall');

      try {
        const response = await fetch(CONFIG.csvUrl);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        const rawData = parseCSV(csvText);
        
        // 假設第一列是表頭 (時間戳記, 名字, 悄悄話)，從第二列開始取資料
        const messages = rawData.slice(1).map(row => {
          return {
            timestamp: row[0] || '',
            name: row[1] || '無名氏',
            message: row[2] || ''
          };
        }).filter(item => item.message !== ''); // 過濾空留言

        // 隱藏 Loading
        loadingEl.style.display = 'none';

        if (messages.length === 0) {
          wallEl.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted);">目前還沒有留言唷！</p>';
          return;
        }

        // 動態生成卡片 DOM
        messages.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.index = index;

          // 格式化時間 (只顯示年月日/時間)
          const formattedTime = item.timestamp ? item.timestamp.split(' ')[0] : '';

          card.innerHTML = `
            <div class="card-header">
              <span class="card-name">${escapeHTML(item.name)}</span>
              <span class="card-time">${escapeHTML(formattedTime)}</span>
            </div>
            <div class="card-message">${escapeHTML(item.message)}</div>
          `;

          wallEl.appendChild(card);
        });

        // 啟動 3 秒輪播亮起特效
        startCarousel();

      } catch (error) {
        console.error('Fetch error:', error);
        loadingEl.innerHTML = '<p style="color:#d9534f;">資料載入失敗，請稍後再試。</p>';
      }
    }

    // 防範 XSS 攻擊字元轉義
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    /* ==========================================================================
       3. 卡片 3 秒自動輪播亮起特效 (Highlights)
       ========================================================================== */
    let currentIndex = -1;
    let carouselTimer = null;

    function startCarousel() {
      const wall = document.getElementById('wall');
      const cards = document.querySelectorAll('.card');
      
      if (cards.length === 0) return;

      // 新增 className 讓牆面套用「非高亮卡片變暗」的 CSS
      wall.classList.add('has-highlight');

      function highlightNextCard() {
        // 移除上一張卡片的高亮
        if (currentIndex >= 0 && cards[currentIndex]) {
          cards[currentIndex].classList.remove('highlight');
        }

        // 遞增索引值，循環輪播
        currentIndex = (currentIndex + 1) % cards.length;
        
        // 加上新卡片的高亮
        const currentCard = cards[currentIndex];
        currentCard.classList.add('highlight');

        // 自動將視覺平滑捲動到高亮的卡片 (體驗優化)
        currentCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }

      // 立即執行一次
      highlightNextCard();

      // ✨【設定計時器】每 3 秒 (CONFIG.carouselInterval) 換下一張
      carouselTimer = setInterval(highlightNextCard, CONFIG.carouselInterval);
    }

    /* ==========================================================================
       4. 日系櫻花背景飄落特效 (HTML5 Canvas)
       ========================================================================== */
    function initSakura() {
      const canvas = document.getElementById('sakura-canvas');
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // 櫻花瓣類別
      class Petal {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * -height;
          this.size = Math.random() * 7 + 5;
          this.speedY = Math.random() * 1.2 + 0.8;
          this.speedX = Math.random() * 0.8 - 0.4;
          this.angle = Math.random() * Math.PI * 2;
          this.spin = (Math.random() - 0.5) * 0.02;
          this.opacity = Math.random() * 0.5 + 0.4;
        }

        update() {
          this.y += this.speedY;
          this.x += Math.sin(this.y / 30) + this.speedX;
          this.angle += this.spin;

          if (this.y > height) {
            this.reset();
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          ctx.fillStyle = `rgba(255, 183, 197, ${this.opacity})`;
          ctx.beginPath();
          // 繪製花瓣橢圓幾何形狀
          ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const petals = Array.from({ length: CONFIG.sakuraCount }, () => new Petal());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        petals.forEach(petal => {
          petal.update();
          petal.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    }

    /* ==========================================================================
       初始化執行
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initSakura();
      fetchAndRenderMessages();
    });
  </script>
</body>
</html>
