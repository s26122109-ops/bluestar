<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？ - 隨機美食抽籤機</title>
    <!-- 引入外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts 圓潤字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti 慶祝彩花套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- 引入外部 JS 檔案 (使用 defer 確保 HTML 載入完成) -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="macaron-bg-bubbles">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
    </div>

    <div class="container">
        <!-- 標題與結果顯示區域 -->
        <header class="header">
            <div class="badge">✨ 告別選擇困難症 ✨</div>
            <h1 id="main-title" class="main-title bounce-in">今天吃什麼？</h1>
        </header>

        <!-- 主要互動卡片 -->
        <main class="card">
            <!-- 未抽籤或抽籤中的顯示 -->
            <div id="draw-section" class="draw-section">
                <div class="slot-machine">
                    <span id="slot-text">🍱 ✨ 🍔 🍕 🍜 🍣</span>
                </div>
                <button id="draw-btn" class="btn btn-primary pulse">
                    <span class="btn-icon">🎲</span> 點我抽籤！
                </button>
            </div>

            <!-- 抽籤結果與詳細卡片（預設隱藏） -->
            <div id="result-card" class="result-card hidden">
                <div class="img-wrapper">
                    <img id="result-img" src="" alt="餐廳美食照片">
                    <span class="category-tag">美味首選</span>
                </div>
                
                <h2 id="result-name" class="result-name">餐廳名稱</h2>
                <p id="result-desc" class="result-desc">這家評價超棒，準備好大飽口福了嗎？</p>

                <div class="action-buttons">
                    <a id="map-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-map">
                        🚀 馬上出發 (Google Maps)
                    </a>
                    <button id="retry-btn" class="btn btn-secondary">
                        🔄 不喜歡？再抽一次
                    </button>
                </div>
            </div>
        </main>

        <!-- 管理口袋名單功能區 -->
        <section class="management-card">
            <details>
                <summary>⚙️ 管理我的美食口袋名單 (<span id="restaurant-count">5</span>)</summary>
                <div class="management-content">
                    <form id="add-form" class="add-form">
                        <input type="text" id="input-name" placeholder="餐廳名稱 (例如: 豪哥水餃)" required>
                        <input type="url" id="input-img" placeholder="照片網址 (選填 https://...)">
                        <button type="submit" class="btn btn-small">➕ 新增</button>
                    </form>
                    <ul id="restaurant-list" class="restaurant-list">
                        <!-- 動態產生餐廳清單 -->
                    </ul>
                    <button id="reset-btn" class="btn-text">恢復預設餐廳名單</button>
                </div>
            </details>
        </section>

        <footer>
            <p>💖 馬卡龍美食隨機抽籤機 | 祝您用餐愉快！</p>
        </footer>
    </div>

</body>
</html>
