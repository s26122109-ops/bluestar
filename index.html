<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集 | 網頁程式課作品集入口</title>
    <style>
        /* ==================== 1. 全局樣式與櫻花主題設定 ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Microsoft JhengHei, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            /* 柔和櫻花粉漸層背景 */
            background: linear-gradient(135deg, #ffedef 0%, #ffe0e6 40%, #fbc4ab 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 櫻花飄落背景粒子動畫 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 183, 197, 0.4) 0%, transparent 8%),
                radial-gradient(circle at 80% 20%, rgba(255, 209, 220, 0.5) 0%, transparent 6%),
                radial-gradient(circle at 50% 70%, rgba(255, 183, 197, 0.3) 0%, transparent 10%),
                radial-gradient(circle at 10% 80%, rgba(255, 154, 162, 0.3) 0%, transparent 7%),
                radial-gradient(circle at 90% 85%, rgba(255, 183, 197, 0.4) 0%, transparent 9%);
            pointer-events: none;
            z-index: 0;
            animation: floatingPetals 15s ease-in-out infinite alternate;
        }

        @keyframes floatingPetals {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        /* ==================== 2. 毛玻璃主要容器 (Glassmorphism) ==================== */
        .glass-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.35);
            /* 毛玻璃的核心：背景模糊與半透明邊框 */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 20px 50px rgba(230, 120, 150, 0.15),
                inset 0 0 15px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* ==================== 3. 個人資訊區 (大頭貼與名字) ==================== */
        .profile-section {
            margin-bottom: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 18px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(255, 105, 135, 0.25);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.08) rotate(3deg);
        }

        /* 大頭貼外圍光暈效果 */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px stroke #ffb3c1;
            background: linear-gradient(45deg, #ff9aa2, #ffb7b2, #ffdac1);
            z-index: -1;
            opacity: 0.6;
            filter: blur(4px);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.98); opacity: 0.5; }
            100% { transform: scale(1.03); opacity: 0.8; }
        }

        .user-name {
            font-size: 1.85rem;
            font-weight: 700;
            color: #5c3d46;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8c5a68;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* ==================== 4. 關卡按鈕網格 (Grid Layout) ==================== */
        .button-grid {
            display: grid;
            /* 電腦版預設為 4 欄 */
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        .btn {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            padding: 15px 10px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ----- 已解鎖按鈕 (Unlocked Buttons) ----- */
        .btn-unlocked {
            background: rgba(255, 255, 255, 0.65);
            color: #6b3e4b;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 15px rgba(230, 130, 150, 0.12);
            cursor: pointer;
        }

        /* 已解鎖標籤貼紙 */
        .btn-unlocked::before {
            content: 'READY';
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            background: #ff758f;
            color: #fff;
            padding: 2px 6px;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }

        /* 酷炫 Hover 動畫效果 */
        .btn-unlocked:hover {
            transform: translateY(-7px) scale(1.02);
            background: rgba(255, 255, 255, 0.95);
            color: #ff4d6d;
            border-color: #ffb3c1;
            box-shadow: 
                0 12px 25px rgba(255, 117, 143, 0.3),
                0 0 15px rgba(255, 179, 193, 0.5);
        }

        /* 點擊光芒效果 */
        .btn-unlocked::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .btn-unlocked:hover::after {
            transform: rotate(45deg) translateY(100%);
        }

        /* ----- 未解鎖按鈕 (Locked Buttons) ----- */
        .btn-locked {
            background: rgba(220, 215, 220, 0.25);
            color: #8e8a93;
            border: 1px dashed rgba(180, 170, 180, 0.4);
            cursor: not-allowed;
            backdrop-filter: blur(4px);
        }

        .btn-locked .lock-icon {
            font-size: 1.1rem;
            margin-bottom: 4px;
            filter: grayscale(80%);
            transition: transform 0.3s ease;
        }

        /* 未解鎖懸停微動畫 (抖動鎖頭) */
        .btn-locked:hover {
            background: rgba(210, 200, 210, 0.35);
            border-color: rgba(160, 150, 160, 0.6);
        }

        .btn-locked:hover .lock-icon {
            animation: lockShake 0.4s ease-in-out;
        }

        @keyframes lockShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-12deg); }
            40% { transform: rotate(12deg); }
            60% { transform: rotate(-8deg); }
            80% { transform: rotate(8deg); }
        }

        /* ==================== 5. 響應式切換 (RWD) ==================== */
        /* 平板電腦 (少於 820px)：改為 3 欄 */
        @media (max-width: 820px) {
            .button-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }

        /* 手機直向 (少於 550px)：改為 2 欄 */
        @media (max-width: 550px) {
            .glass-container {
                padding: 30px 18px;
                border-radius: 20px;
            }

            .avatar-wrapper {
                width: 105px;
                height: 105px;
            }

            .user-name {
                font-size: 1.5rem;
            }

            .button-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .btn {
                min-height: 72px;
                font-size: 0.85rem;
                padding: 12px 8px;
            }
        }

        /* 超小螢幕手機 (少於 360px)：改為 1 欄 */
        @media (max-width: 360px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
